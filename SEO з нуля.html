<style>
/* Layout: курс як "лабораторний журнал" — карта курсу зліва, урок справа: відеоплеєр-розбір → ілюстрація → теорія → кроки → чек-лист → тест */
:root{

  --f-display:"Unbounded", "Golos Text", system-ui, sans-serif;

}

  --accent:#43C690; --accent-ink:#06140E; --accent-soft:#12352A;
  --warn:#E6A640; --warn-soft:#3A2B10; --bad:#F2766B; --bad-soft:#3D1B18; --info:#7EA8F0; --info-soft:#17284A;
  --code-bg:#08110E; --code-fg:#D6E9DE; color-scheme:dark }}
:root[data-theme="dark"]{

  --accent:#43C690; --accent-ink:#06140E; --accent-soft:#12352A;
  --warn:#E6A640; --warn-soft:#3A2B10; --bad:#F2766B; --bad-soft:#3D1B18; --info:#7EA8F0; --info-soft:#17284A;
  --code-bg:#08110E; --code-fg:#D6E9DE; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px 40px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-bottom:6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.prog{margin:14px 0 18px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.blk{margin-top:18px}
.blk-h{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px 6px}

.les.done .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}

.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.pl-yt{font-size:13px;color:var(--muted);margin:0 0 6px}

/* Ілюстрації */
figure.ill{margin:24px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}

.svg-t{font-family:var(--f-body)}

.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}

.tool .price{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}

.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:28px 0}

.bcard .btn{align-self:flex-start;margin-top:auto}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px;min-width:0}

  .blocks,.gloss{grid-template-columns:minmax(0,1fr)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body:[['h','Звідки брати запити'],['ul',[`<b>Маркерні слова (seed).</b> Почніть з 10–20 очевидних: «переклад документів», «нотаріальний переклад», «присяжний перекладач».`,`<b>Google Ads → Інструменти → Планувальник ключових слів.</b> «Знайти нові ключові слова» → вставити маркери → обрати країну і мову. Показує діапазон частотності.`,`<b>Serpstat / Ahrefs / Semrush</b> — точніша частотність, складність (KD), ключі конкурентів.`,`<b>Підказки Google</b> — почніть вводити запит і перепишіть варіанти. Блок «Люди також запитують».`,`<b>Search Console → Ефективність</b> — для сайту, що вже працює.`,`<b>Google Trends</b> — сезонність.`]],
['h','Метрики'],['table',['Метрика','Що означає'],[['Частотність (volume)','Скільки разів на місяць шукають'],['KD (складність)','Наскільки важко потрапити в топ'],['Інтент','Що людина хоче: дізнатися, купити, знайти конкретний сайт'],['CPC','Ціна кліку в рекламі — показує комерційну цінність']]],

['note','tip',`Для двомовного ринку збирайте ядро на кожну мову окремо: польські користувачі шукають «tłumacz przysięgły», а не «присяжний перекладач».`]],
steps:[[`Випишіть маркери`,`10–20 базових фраз по кожній послузі.`],[`Розширте в Keyword Planner`,`Країна + мова, експорт у таблицю.`],[`Додайте ключі конкурентів`,`Serpstat / Ahrefs → органічні ключові слова 3 конкурентів.`],[`Обʼєднайте і почистіть`,`Одна таблиця, без дублів і нерелевантного.`],[`Позначте інтент`,`Колонка: інфо / комерційний / транзакційний.`]],

body:[['table',['Що перевіряємо','Де','Що робимо'],[['Посилання на сторінки з 404','Ahrefs → Best by links → фільтр 404; GSC → Посилання','301 на актуальну сторінку — повертає вагу'],['Втрачені посилання','Ahrefs / Serpstat → Lost backlinks','Написати власнику сайту, відновити'],['Анкори','Anchors','Природні: бренд, URL, загальні фрази'],['Спамні донори','Referring domains, сортування за якістю','Зазвичай Google ігнорує сам. Disavow — тільки при ручних санкціях'],['Ручні санкції','GSC → Безпека та ручні дії','Має бути «Проблем не виявлено»'],['Локальні згадки','Google Business Profile, каталоги','Однаковий NAP, актуальні години, фото, відповіді на відгуки']]]],
steps:[[`Експорт посилань`,`GSC → Посилання → Експорт; Ahrefs / Serpstat.`],[`404 з посиланнями`,`301 на відповідну сторінку.`,'redirect'],[`Ручні дії`,`Перевірити GSC.`],[`Google Business Profile`,`Актуалізувати.`,'backlinks']],

['h','Звіт клієнту чи керівнику'],['ul',[`Що знайдено (з пріоритетами).`,`Що виправлено (журнал змін).`,`Що змінилось: індексація, покази, кліки, позиції, швидкість — до і після.`,`План на наступний місяць.`,`Дашборд: Looker Studio з даними GSC і GA4.`]],

</script>
<script>
(function(){
const BLOCKS=[B1,B2];
const ALL=[];BLOCKS.forEach(b=>b.mods.forEach((m,mi)=>m.les.forEach(l=>ALL.push({l,m,b,mi}))));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get('seo-done',[]));
let checks=store.get('seo-checks',{});
let timer=null;

const side=document.getElementById('side'),view=document.getElementById('view'),scrim=document.getElementById('scrim');
function closeMenu(){side.classList.remove('open');scrim.hidden=true}
document.getElementById('menuBtn').onclick=()=>{side.classList.add('open');scrim.hidden=false};
scrim.onclick=closeMenu;

function renderSide(cur){
  const pct=Math.round(done.size/ALL.length*100);
  let h=`<a class="brand" href="#start"><span class="brand-mark">200</span><b>SEO з нуля</b></a>
  <div class="prog">Пройдено ${done.size} з ${ALL.length} уроків · ${pct}%<div class="bar"><i style="width:${pct}%"></i></div></div>`;
  BLOCKS.forEach(b=>{
    h+=`<div class="blk"><div class="blk-h">${b.no}<span>${b.title}</span></div>`;
    b.mods.forEach((m,mi)=>{
      const ids=m.les.map(l=>l.id),d=ids.filter(i=>done.has(i)).length,open=ids.includes(cur);
      h+=`<details class="mod"${open?' open':''}><summary><span class="n">${String(mi+1).padStart(2,'0')}</span>${m.t}<span class="c">${d}/${ids.length}</span></summary>`;
      m.les.forEach(l=>{h+=`<a class="les${l.id===cur?' on':''}${done.has(l.id)?' done':''}" href="#${l.id}"><span class="dot"></span><span>${l.t}</span></a>`});
      h+=`</details>`});
    h+=`</div>`});
  side.innerHTML=h;
}

function code(cap,txt){const lines=esc(txt).split('\n').map(l=>/^\s*(#|&lt;!--|\/\/)/.test(l)?`<span class="c">${l}</span>`:l.replace(/"([^"]*?)"/g,'<span class=s>"$1"</span>').replace(/(&lt;\/?[a-zA-Z!][^\s&]*)/g,'<span class=k>$1</span>'));return `${cap?`<div class="code-cap">${esc(cap)}</div>`:''}<pre class="code">${lines.join('\n')}</pre>`}
function ill(key,a,b2){const f=ILL[key];return f?f(a,b2):''}
function block(it){
  const [t,a,b,c]=it;
  if(t==='h')return `<h3>${a}</h3>`;
  if(t==='p')return `<p>${a}</p>`;
  if(t==='ul')return `<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(t==='ol')return `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(t==='table')return `<div class="tbl"><table><thead><tr>${a.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(t==='code')return code(a,b);
  if(t==='note'){const lab={tip:'Порада',warn:'Увага',bad:'Небезпечно'}[a];return `<div class="note ${a}"><span class="ic">${lab}</span><p>${b}</p></div>`}
  if(t==='tools')return `<div class="tools">${a.map(x=>`<div class="tool"><span class="price">${x[1]}</span><b>${x[0]}</b><small>${x[2]}</small></div>`).join('')}</div>`;
  if(t==='ill')return `<figure class="ill">${ill(a,b)}<figcaption>${c||''}</figcaption></figure>`;
  return '';
}

function home(){
  const first=ALL.find(x=>!done.has(x.l.id))||ALL[0];
  let h=`<section class="hero"><div class="kicker">HTTP/1.1 200 OK · курс для новачків</div>
  <h1>SEO з нуля: від першої сторінки до чистого індексу</h1>
  <p class="lead">Два блоки практики. У першому ви запускаєте новий сайт і налаштовуєте все, що потрібно Google. У другому — приходите на готовий сайт на WordPress і виправляєте його помилки. Кожен урок: анімований розбір, схема, покрокова інструкція, чек-лист і тест.</p>
  <p><a class="btn pri" href="#${first.l.id}">${done.size?'Продовжити':'Почати навчання'} →</a></p></section>
  <div class="blocks">`;
  BLOCKS.forEach(b=>{const n=b.mods.reduce((s,m)=>s+m.les.length,0);h+=`<div class="bcard"><div class="no">${b.no} · ${b.mods.length} модулів · ${n} уроків</div><h3>${b.title}</h3><p>${b.sub}</p><ol>${b.mods.map(m=>`<li>${m.t}</li>`).join('')}</ol><a class="btn" href="#${b.mods[0].les[0].id}">Відкрити блок</a></div>`});
  h+=`</div><h2>Як вчитися за цією програмою</h2><div class="how">
  <div><b>1 · Дивіться</b>Запустіть розбір уроку: сцени перемикаються самі, як у відео.</div>
  <div><b>2 · Читайте</b>Схема і короткий конспект — тільки те, що знадобиться на практиці.</div>
  <div><b>3 · Робіть</b>Повторіть кроки на своєму або тестовому сайті, відмічайте чек-лист.</div>
  <div><b>4 · Перевіряйте</b>Тест наприкінці уроку. Позначте урок пройденим.</div></div>
  <figure class="ill">${ILL.pipeline()}<figcaption>Головна схема курсу. Усі уроки пояснюють, як провести сторінку через ці пʼять етапів.</figcaption></figure>
  <h2>Словник новачка</h2><div class="gloss">`;
  [['Індекс','База сторінок Google. Немає в індексі — немає в пошуку.'],['Googlebot','Робот Google, що сканує сайти.'],['Краулер','Програма-сканер сайту: Screaming Frog, Netpeak Spider.'],['Семантичне ядро','Список запитів, під які оптимізується сайт.'],['Кластер','Група запитів для однієї сторінки.'],['Посадкова сторінка','Сторінка під конкретний запит з метою — заявка.'],['noindex','Тег «не показувати в пошуку».'],['canonical','Тег «головна версія сторінки — ось ця».'],['301','Постійний редирект на нову адресу.'],['hreflang','Звʼязок мовних версій сторінки.'],['Sitemap.xml','Файл-список URL для індексації.'],['robots.txt','Файл з правилами сканування.'],['Дубль','Дві URL з однаковим вмістом.'],['Сирота','Сторінка без жодного внутрішнього посилання.'],['CTR','Частка кліків від показів у видачі.'],['Core Web Vitals','Метрики швидкості: LCP, INP, CLS.']].forEach(g=>h+=`<div><b>${g[0]}</b> — ${g[1]}</div>`);
  h+=`</div>`;
  view.innerHTML=h;
}

function lesson(id){
  const idx=ALL.findIndex(x=>x.l.id===id);if(idx<0)return home();
  const {l,m,b,mi}=ALL[idx],prev=ALL[idx-1],next=ALL[idx+1];
  const mainIll=ill(l.ill[0],l.ill[1],l.ill[2]);
  let h=`<div class="crumbs"><b>${b.no}</b><span>›</span><span>Модуль ${mi+1}. ${m.t}</span></div>
  <h1>${l.t}</h1><div class="meta"><span class="chip">⏱ ${l.dur}</span>${l.tools.map(t=>`<span class="chip t">${t}</span>`).join('')}</div>
  <p class="lead">${l.lead}</p>
  <div class="player" id="pl"><div class="pl-head"><span class="rec"></span>Відеорозбір уроку · ${l.steps.length} сцен</div>
  <div class="pl-stage"><div class="pl-ill" id="plIll"></div><div class="pl-txt"><div class="pl-scene" id="plScene"></div><div class="pl-title" id="plTitle"></div><div class="pl-desc" id="plDesc"></div></div></div>
  <div class="pl-ctrl"><button class="pl-btn" id="plBtn" aria-label="Відтворити"></button><div class="pl-track" id="plTrack">${l.steps.map((s,i)=>`<button aria-label="Сцена ${i+1}" data-i="${i}"><i></i></button>`).join('')}</div><span class="pl-time" id="plTime"></span></div></div>
  <p class="pl-yt">Живі відеоінструкції з інтерфейсом програм: <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(l.yt)}" target="_blank" rel="noopener">знайти на YouTube ↗</a></p>
  <figure class="ill">${mainIll}<figcaption>${l.cap}</figcaption></figure>
  <div class="prose">${l.body.map(block).join('')}</div>
  <h2>Покроково</h2><ol class="steps">${l.steps.map(s=>`<li><div><b>${s[0]}</b><p>${s[1]}</p></div></li>`).join('')}</ol>
  <h2>Чек-лист уроку</h2><ul class="checklist">${l.check.map((c,i)=>{const k=l.id+':'+i;return `<li><label><input type="checkbox" id="ck-${l.id}-${i}" data-k="${k}"${checks[k]?' checked':''}><span>${c}</span></label></li>`}).join('')}</ul>
  <h2>Перевір себе</h2><div class="quiz"><div class="q">${l.quiz[0]}</div><div class="opts">${l.quiz[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="ex" id="qx" hidden></div></div>
  <div class="foot">${prev?`<a class="btn" href="#${prev.l.id}">← ${prev.l.t}</a>`:'<span></span>'}
  <button class="btn ${done.has(id)?'done':'pri'}" id="doneBtn">${done.has(id)?'✓ Урок пройдено':'Позначити пройденим'}</button>
  ${next?`<a class="btn" href="#${next.l.id}">${next.l.t} →</a>`:'<a class="btn" href="#start">До початку курсу</a>'}</div>`;
  view.innerHTML=h;

  view.querySelectorAll('.checklist input').forEach(c=>c.onchange=()=>{checks[c.dataset.k]=c.checked;store.set('seo-checks',checks)});
  view.querySelectorAll('.quiz .opt').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.i,ok=i===l.quiz[2];view.querySelectorAll('.quiz .opt').forEach((o,j)=>{o.classList.remove('ok','no');if(j===l.quiz[2])o.classList.add('ok')});if(!ok)btn.classList.add('no');const x=document.getElementById('qx');x.hidden=false;x.innerHTML=`<b>${ok?'Правильно.':'Не зовсім.'}</b> ${l.quiz[3]}`});
  document.getElementById('doneBtn').onclick=()=>{if(done.has(id))done.delete(id);else done.add(id);store.set('seo-done',[...done]);renderSide(id);const b=document.getElementById('doneBtn');b.className='btn '+(done.has(id)?'done':'pri');b.textContent=done.has(id)?'✓ Урок пройдено':'Позначити пройденим'};

  // плеєр
  const scenes=l.steps.map(s=>s[2]?ill(s[2],s[3],s[4]):mainIll);
  const DUR=7000;let cur=0,el=0,playing=false;
  const $=i=>document.getElementById(i);
  const icon=p=>p?'<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>':'<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>';
  const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  function show(i){cur=i;el=0;$('plIll').innerHTML=scenes[i];$('plScene').textContent=`Сцена ${i+1} / ${l.steps.length}`;$('plTitle').textContent=l.steps[i][0];$('plDesc').innerHTML=l.steps[i][1];paint()}
  function paint(){[...$('plTrack').children].forEach((b,j)=>b.firstChild.style.width=(j<cur?100:j===cur?el/DUR*100:0)+'%');$('plTime').textContent=fmt(cur*DUR+el)+' / '+fmt(l.steps.length*DUR)}
  function setPlay(p){playing=p;$('plBtn').innerHTML=icon(p);$('plBtn').setAttribute('aria-label',p?'Пауза':'Відтворити');clearInterval(timer);if(p)timer=setInterval(()=>{el+=100;if(el>=DUR){if(cur<l.steps.length-1)show(cur+1);else{el=DUR;paint();setPlay(false);return}}paint()},100)}
  $('plBtn').onclick=()=>{if(!playing&&cur===l.steps.length-1&&el>=DUR)show(0);setPlay(!playing)};
  [...$('plTrack').children].forEach(b=>b.onclick=()=>{show(+b.dataset.i)});
  show(0);setPlay(false);
}

function route(){
  clearInterval(timer);closeMenu();
  const id=location.hash.slice(1);
  renderSide(id);
  if(!id||id==='start')home();else lesson(id);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
